# 只验证「能构建」。PR 与 main 推送都会运行；构建产物以 artifact 形式可下载预览。
# 校验与测试不在这里跑：validate / validate:strict / test / test:browser 均为本地手动命令，
# 需要自查时自己跑，不作为合并或发布的门槛。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 上传站点预览
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/
          retention-days: 14
