# 发布到 gh-pages 分支。已改为「只手动触发」：
# 这个库是个人学习用，不再随每次 push 自动公开。
# 需要更新线上版本时，到 Actions → Deploy Pages → Run workflow 手动跑。
#
# 前置条件（仓库 Settings）：
#   Settings → Actions → General → Workflow permissions 需要 "Read and write"，
#   否则 GITHUB_TOKEN 无法推送 gh-pages 分支。
name: Deploy Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 结构与史料规则校验（STRICT：发布前同样按 error 阻断）
        run: npm run validate:strict

      - name: 构建站点
        run: npm run build

      - name: 渲染冒烟测试
        run: npm test

      - name: 真实浏览器冒烟测试
        run: npm run test:browser

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # 与手工同步一致：全量替换，清理已删除的媒体与数据文件
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
